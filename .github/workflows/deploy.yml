name: Deploy frontend

on:
  push:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.e.outputs.env }}
      api: ${{ steps.e.outputs.api }}
    steps:
      - id: e
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "api=https://api.infrastructure.jeccamtech.com" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "api=https://api-dev.infrastructure.jeccamtech.com" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  build-push:
    needs: [setup, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        id: buildx1
        continue-on-error: true
      - uses: docker/setup-buildx-action@v3
        if: steps.buildx1.outcome == 'failure'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build1
        continue-on-error: true
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ needs.setup.outputs.api }}
          tags: |
            ghcr.io/${{ env.OWNER }}/sigep-frontend:${{ needs.setup.outputs.env }}
            ghcr.io/${{ env.OWNER }}/sigep-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        if: steps.build1.outcome == 'failure'
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ needs.setup.outputs.api }}
          tags: |
            ghcr.io/${{ env.OWNER }}/sigep-frontend:${{ needs.setup.outputs.env }}
            ghcr.io/${{ env.OWNER }}/sigep-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [setup, build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/sigep
            ENV=${{ needs.setup.outputs.env }}
            docker compose --env-file .env.$ENV -p sigep-$ENV pull frontend
            docker compose --env-file .env.$ENV -p sigep-$ENV up -d --force-recreate frontend
            docker image prune -f
