name: CI

on:
  pull_request:
  push:
    branches-ignore: [develop, master]

jobs:
  build:
    name: Types & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.infrastructure.jeccamtech.com
